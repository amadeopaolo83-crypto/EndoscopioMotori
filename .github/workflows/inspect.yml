name: Inspect library
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Contenuto
        shell: bash {0}
        run: |
          B=https://jitpack.io/com/github/jiangdongguo/AndroidUSBCamera
          curl -sfL -o a.aar $B/libausbc/3.3.3/libausbc-3.3.3.aar; unzip -l a.aar | grep -E "\.so|classes" ; unzip -q -o a.aar classes.jar -d a; unzip -l a/classes.jar | grep -c "com/jiangdg/usb/"
          curl -sfL -o n.aar $B/libnative/3.3.3/libnative-3.3.3.aar; unzip -l n.aar | grep -E "\.so|classes"; unzip -q -o n.aar classes.jar -d n; unzip -l n/classes.jar | grep -c "com/jiangdg/usb/"
          for v in 3.3.2 3.3.1 3.3.0 3.2.10; do echo "== $v"; for m in libausbc libuvc libnative; do curl -s -o /dev/null -w "$m %{http_code}\n" $B/$m/$v/$m-$v.pom; done; done
