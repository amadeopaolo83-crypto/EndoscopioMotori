name: Inspect library
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: API
        run: |
          V=3.3.3
          curl -sfL -o lib.aar https://jitpack.io/com/github/jiangdongguo/AndroidUSBCamera/libausbc/$V/libausbc-$V.aar
          mkdir aar && cd aar && unzip -q ../lib.aar && unzip -o -q classes.jar -d cls
          for n in com.jiangdg.ausbc.MultiCameraClient 'com.jiangdg.ausbc.MultiCameraClient$ICamera' com.jiangdg.ausbc.MultiCameraClient\$Companion com.jiangdg.ausbc.camera.CameraUVC com.jiangdg.ausbc.camera.bean.CameraRequest 'com.jiangdg.ausbc.camera.bean.CameraRequest$Builder' com.jiangdg.ausbc.camera.bean.PreviewSize com.jiangdg.ausbc.callback.IDeviceConnectCallBack com.jiangdg.ausbc.callback.ICameraStateCallBack 'com.jiangdg.ausbc.callback.ICameraStateCallBack$State' com.jiangdg.ausbc.callback.ICaptureCallBack com.jiangdg.ausbc.callback.IPreviewDataCallBack com.jiangdg.ausbc.widget.AspectRatioSurfaceView com.jiangdg.ausbc.widget.IAspectRatio com.jiangdg.ausbc.camera.bean.CameraUvcInfo; do
            echo "=== $n"; javap -public -cp cls "$n" 2>&1 | head -120
          done
          echo "=== libuvc deps"
          curl -sfL https://jitpack.io/com/github/jiangdongguo/AndroidUSBCamera/libuvc/$V/libuvc-$V.pom | grep -E "artifactId|version" | head
          curl -sfL -o uvc.aar https://jitpack.io/com/github/jiangdongguo/AndroidUSBCamera/libuvc/$V/libuvc-$V.aar && mkdir u && cd u && unzip -q ../uvc.aar && ls -R . | head -40
