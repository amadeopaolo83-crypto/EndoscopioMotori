name: Inspect library
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Contenuto
        shell: bash {0}
        run: |
          git clone -q --depth 1 --branch 3.3.3 https://github.com/jiangdongguo/AndroidUSBCamera.git src
          cd src; ls
          for f in build.gradle settings.gradle gradle/wrapper/gradle-wrapper.properties gradle.properties libuvc/build.gradle libnative/build.gradle libausbc/build.gradle libutils/build.gradle libuvccommon/build.gradle; do echo "=== $f"; cat $f | head -80; done
          ls libuvc libuvc/src/main libnative/src/main 2>&1 | head -40
          echo $ANDROID_NDK_HOME $ANDROID_SDK_ROOT; ls $ANDROID_SDK_ROOT/ndk
