name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accetta licenze Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Scarica librerie AUSBC
        run: |
          mkdir -p EndoscopioMotori/app/libs
          git clone -q --depth 1 --branch 3.3.3 https://github.com/jiangdongguo/AndroidUSBCamera.git /tmp/ausbc
          cp /tmp/ausbc/libnative/aar/libnative-*.aar /tmp/ausbc/libuvc/aar/libuvc-*.aar /tmp/ausbc/libuvccommon/aar/libuvccommon-*.aar EndoscopioMotori/app/libs/
          curl -sfL -o EndoscopioMotori/app/libs/libausbc-3.3.3.aar https://jitpack.io/com/github/jiangdongguo/AndroidUSBCamera/libausbc/3.3.3/libausbc-3.3.3.aar
          ls -la EndoscopioMotori/app/libs
      - name: Compila APK debug
        working-directory: EndoscopioMotori
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: endoscopio-motori-apk
          path: EndoscopioMotori/app/build/outputs/apk/debug/app-debug.apk
